<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Taka's Site">
    <meta property="og:description" content="Pssst, check out Taka's personal site.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#3472a5">
    <meta property="og:url" content="https://taka-lgbt.github.io">
    <meta name="twitter:card" content="summary_large_image">

    <title>Taka's Site</title>

<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
const redirect = new URLSearchParams(window.location.search).get("redirect");
const parse = new URLSearchParams(window.location.search).get("parse");

const parses = {
homepage: "/md/homepage.md"};

let parsePage = parses[parse];

if (parsePage) { 
fetch(`https://raw.githubusercontent.com/takalgbt/takalgbt.github.io/main/${parsePage}`)
.then(function(response) {
return response.text(); 
})
.then(function(data) {
document.body.innerHTML = marked.parse(data); 
})
.catch(function(error) {
console.error("Error", error);
})}

const redirects = {
youtube: "https://youtube.com/@takalgbt",
bsky: "https://bsky.app/profile/takalgbt.bsky.social",
github: "https://github.com/takalgbt",
gmail: "mailto:takalgbt@gmail.com",
twitch: "https://twitch.tv/takalgbt",
reddit: "https://reddit.com/u/takalgbt"};

let redirectTo = redirects[redirect];

if (redirectTo) { window.location.href = redirectTo; } else if (!redirectTo && !parsePage) { window.location.href = "?parse=homepage"; }
</script>
</head>
<body>
<p>If you see this, something went wrong, your internet connection sucks, or your client is preventing JS from being executed.</p>
</body>
</html>
